[project]
name = "casehistory"
version = "0.1.0"
description = "Collect and normalize historical U.S. Supreme Court cases and U.S. Code versions for exploration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "orjson>=3.11.9",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[project.scripts]
casehistory = "casehistory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casehistory"]
